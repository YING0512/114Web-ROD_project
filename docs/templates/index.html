<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 設定文件編碼與行動裝置視窗初始配置 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>街景辨識介面</title>
  <!-- 引入 Leaflet 地圖樣式 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <!-- Font Awesome：提供語音按鈕圖示 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
  <!-- 自訂樣式檔案 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
  <!-- Leaflet 地圖功能腳本 -->
  <script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
</head>
<body>
  <!-- 頁面載入時的 Loading 畫面 -->
  <div id="loader-wrapper">
    <div class="loader-content">
      <div class="spinner"></div>
      <div class="loading-text">loading...</div>
    </div>
  </div>

  <!-- 搜尋列：使用者可輸入地點，移除語音按鈕於此處 -->
  <div id="search-bar" class="search-bar">
    <input type="text" id="searchInput" placeholder="搜尋地點…" />
    <button id="searchBtn">🔍</button>
  </div>
  
  <!-- 語音開關按鈕：開關地圖語音提示 -->
  <div class="speech-toggle" style="position:fixed; top:25px; right:30px; z-index:1001;">
    <label class="speech-btn" title="語音開關">
      <input type="checkbox" id="speechToggle" checked>
      <span class="slider"></span>
      <i id="speechIcon" class="fa-solid fa-volume-high"></i> 
    </label>
  </div>
  <!-- 語音說明按鈕：顯示語音操作說明 -->
  <div class="speech-info" style="position:fixed; top:25px; right:10px; z-index:1001;">
    <button id="speechInfo" class="speech-info-btn" title="語音操作說明">
      <i class="fa-solid fa-circle-info"></i>
    </button>
  </div>
  <!-- 語音播報提示訊息 -->
  <div id="speechNotice" class="speech-notice" style="display:none;">
    語音播報開啟中…
  </div>

  <!-- 語音導航提示區域：顯示正在行駛路段與下一步路徑 -->
  <div id="navigationPrompt" style="display: none;" class="navigation-prompt">
    <div id="currentRoad">正在行駛：未知路段</div>
    <div id="nextInstruction">即將進入：未知道路</div>
  </div>

  <!-- 搜尋結果列表 -->
  <ul id="searchResults" class="search-results"></ul>

  <!-- 地圖容器：Leaflet 地圖顯示區 -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- 底部三等分按鈕容器：定位、語音導航、相機辨識 -->
  <div class="split-buttons">
    <button class="half-btn" id="locateBtn">
      📍
      <span class="btn-text">定位</span>
    </button>
    <div class="divider"></div>
    <button class="half-btn" id="voiceNavBtn">
      🎤
      <span class="btn-text">語音</span>
    </button>
    <div class="divider"></div>
    <button class="half-btn" id="cameraBtn">
      📷
      <span class="btn-text">辨識</span>
    </button>
  </div>

  <!-- 相機輸入：隱藏的 file input 用於開啟手機相機 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />

  <!-- 引入語音控制腳本 -->
  <script src="{{ url_for('static', filename='js/speech.js') }}"></script>
  <script>
    // 初始化語音 UI 與狀態，並播放開啟提示
    initSpeechUI();
    speakNav("語音播報開啟中…");
  </script>

  <!-- 引入主要行為控制腳本（搜尋、定位、導航等） -->
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
