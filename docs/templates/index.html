<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>街景辨識介面</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
  <script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
</head>
<body>
  <div id="search-bar" class="search-bar">
    <input type="text" id="searchInput" placeholder="搜尋地點…" />
    <button id="searchBtn">🔍</button>
  </div>

  <div id="navigationPrompt" style="display: none;" class="navigation-prompt">
    <div id="currentRoad">正在行駛：未知路段</div>
    <div id="nextInstruction">即將進入：未知道路</div>
  </div>

  <ul id="searchResults" class="search-results"></ul>
 <div id="map-container">
  <div id="map"></div>
</div>

  <!-- 控制面板 -->
  <div class="split-buttons">
    <button class="half-btn" id="locateBtn">📍</button>
    <div class="divider"></div>
    <button class="half-btn" id="cameraBtn">📷</button>
  </div>

  <!-- 相機輸入 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />

  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
