<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>街景辨識介面</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js"></script>
  <script 
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBz4QBMJeCoblbo3INVmtQqI7ejVOoMXRY&libraries=places"
  defer
></script>

</head>
<body>
  <!-- 搜尋欄 -->
  <div class="search-bar">
    <gmpx-place-picker id="placePicker" placeholder="輸入地址或地點"></gmpx-place-picker>
  </div>

   <!-- 地圖顯示區域 -->
  <gmp-map
    id="map"
    center="23.022188,120.224205"
    zoom="14"
    map-id="23b40718a7b519e12b763605"
    style="width:100%;height:100vh;">
    <gmp-advanced-marker
      id="mapMarker"
      position="23.022188,120.224205"></gmp-advanced-marker>
  </gmp-map>

  <!-- 控制面板 -->
  <div class="split-buttons">
    <button class="third-btn" id="locateBtn">📍</button>
    <div class="divider"></div>
    <button class="third-btn" id="navigateBtn">🧭</button>
    <div class="divider"></div>
    <button class="third-btn" id="cameraBtn">📷</button>
  </div>
  
   <!-- 相機輸入 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />

  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
